spring:
  application:
    name: file-converter

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:file_converter}
    username: ${DB_USER:file_converter}
    password: ${DB_PASSWORD:file_converter}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        default_schema: converter
        show-sql: true
        format_sql: true

    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yml
    default-schema: converter
    liquibase-schema: public


  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    input-topic: ${KAFKA_INPUT_TOPIC:files-uploaded}

    listener:
      ack-mode: manual_immediate
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer

      group-id: files-converter
      enable-auto-commit: false # false because we are using inbox pattern
      auto-offset-reset: earliest # используется при падении offset-а

      properties:
        "[spring.json.value.default.type]": "com.example.file.converter.event.FileUploadedEvent"
        "[spring.json.trusted.packages]": "com.example.file.converter.event"
        "[spring.json.use.type.headers]": false


minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:attachments}
