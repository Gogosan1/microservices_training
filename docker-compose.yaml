services:

  postgres:
    image: postgres:17
    container_name: file-converter-postgres

    environment:
      POSTGRES_DB: file_converter
      POSTGRES_USER: file_converter
      POSTGRES_PASSWORD: file_converter

    ports:
      - "5432:5432"

    command: postgres -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10

    volumes:
      - postgres-data:/var/lib/postgresql/data
#      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10


  kafka:
    image: confluentinc/cp-kafka:8.1.0
    container_name: kafka-0
    hostname: kafka-0
    ports:
      - "29092:29092"

    environment:

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9091, EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka-0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-0:9091,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT, EXTERNAL:PLAINTEXT, CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      #only for develop scope. In production scope this parameter is false
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka-0:9091 || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10


  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    hostname: kafka-ui

    ports:
      - "8081:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-0:9091
      DYNAMIC_CONFIG_ENABLED: "true"

  minio:
    image: minio/minio:latest
    container_name: minio

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-file_converter}
      DB_USER: ${POSTGRES_USER:-file_converter}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

      KAFKA_BOOTSTRAP_SERVERS: kafka-0:9091
      KAFKA_INPUT_TOPIC: ${KAFKA_INPUT_TOPIC:-files-uploaded}
      MINIO_ENDPOINT: http://minio:9000

    depends_on:
      postgres:
        condition: service_healthy


  debezium:
    image: debezium/connect:2.5
    container_name: file-converter-debezium

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

    ports:
      - "8083:8083"

    volumes:
      - ./docker/debezium:/config:ro

    environment:

      BOOTSTRAP_SERVERS: kafka-0:9091
      GROUP_ID: 1

      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_status
      CONFIG_STORAGE_TOPIC: debezium_connect_configs

      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"


volumes:
  postgres-data:
  kafka-data:
  minio-data: